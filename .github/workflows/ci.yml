name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # DuckDB is a C++ library; the Go module ships prebuilt static libraries,
  # so CGO is all that is needed here.
  CGO_ENABLED: "1"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Node is needed to build the web interface, never to run it. The version
      # comes from web/.nvmrc so CI and a developer's machine cannot disagree,
      # and pnpm is pinned through package.json's packageManager field.
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc

      - name: Enable the pinned pnpm
        run: corepack enable

      # --frozen-lockfile: an install that would rewrite pnpm-lock.yaml fails
      # instead. The lockfile carries the exact version and an integrity hash
      # for every package, which is what makes the committed file the analog
      # of go.sum. See docs/frontend-stack.md.
      - name: Install web dependencies (frozen)
        run: make web-install

      - name: Check the web interface
        run: make web-check

      - name: Build the web interface
        run: make web

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: make build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: e2e/.nvmrc

      - name: Enable the pinned pnpm
        run: corepack enable

      - name: Install web dependencies (frozen)
        run: make web-install

      # e2e/ has its own lockfile so that Playwright never enters the shipped
      # interface's dependency tree. Its install scripts are blocked like every
      # other one, so the browser download is an explicit step below rather than
      # something a postinstall does behind us.
      - name: Install e2e dependencies (frozen)
        run: cd e2e && corepack pnpm install --frozen-lockfile

      # --with-deps is the system libraries, which need root; that is available
      # on a throwaway runner and is why this is one line here and a manual step
      # on a developer's machine.
      - name: Install the browser
        run: cd e2e && corepack pnpm exec playwright install --with-deps chromium

      # Builds the interface and the server, serves on a throwaway data
      # directory, runs the tests against the embedded build, tears it down.
      - name: Run the browser tests
        run: ./e2e/run-local.sh

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # An image that has stopped building is a deployment story that rots
      # quietly: nobody notices until somebody needs to deploy. This also runs
      # the Dockerfile's own assertion, which is the only thing that catches an
      # image whose web interface silently did not make it in.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: veritix:ci

      # A smoke test in the shipped artifact rather than in the build tree: the
      # binary that runs here is the one a customer would run, with the
      # interface embedded and nothing else installed alongside it.
      - name: Check what shipped
        run: |
          docker run --rm veritix:ci version --json | tee /dev/stderr | grep -q '"web": true'

      - name: Audit a fixture inside the image
        run: |
          docker run --rm -v "$PWD/testdata:/testdata:ro" veritix:ci \
            audit /testdata/dirty-retail --format json | jq -e '.finding_summary'

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc

      - name: Enable the pinned pnpm
        run: corepack enable

      # The Go modules are deliberately not vendored — the tree is 728 MB, most
      # of it opaque prebuilt DuckDB libraries whose diffs nobody could review.
      # These checks are what stands in for a vendor/ directory: go.sum plus the
      # checksum transparency log for integrity, govulncheck for known holes.
      - name: Verify module checksums
        run: go mod verify

      - name: Check Go dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Install web dependencies (frozen)
        run: make web-install

      # The npm-side equivalent. The 7-day publish cooldown in
      # web/pnpm-workspace.yaml is what buys a compromised release time to be
      # reported; this is what notices once it has been.
      - name: Check web dependencies for known vulnerabilities
        run: cd web && corepack pnpm audit --audit-level=high

      # e2e/ never ships to a customer, but it runs on developer machines and on
      # this runner with a checkout of the repository, so it gets audited too.
      - name: Install e2e dependencies (frozen)
        run: cd e2e && corepack pnpm install --frozen-lockfile

      - name: Check e2e dependencies for known vulnerabilities
        run: cd e2e && corepack pnpm audit --audit-level=high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
