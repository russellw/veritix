# Veritix's own configuration, mounted at /etc/veritix/config.yaml.
#
# Anything here can be overridden per-pod by a VERITIX_* environment variable;
# the file is for what an operator wants written down and reviewable.

log:
  level: info
  # json, because in a cluster these lines are going into a log pipeline rather
  # than onto somebody's terminal.
  format: json

server:
  # The container binds all interfaces because it is reached from outside the
  # pod. serve refuses a non-loopback address without an auth token, which is
  # why the Deployment supplies one from a Secret.
  addr: 0.0.0.0:8080
  data_dir: /data
  # How long a finished run's ingested data is kept. Every run leaves a DuckDB
  # copy of the dataset behind so that a finding's offending rows can be
  # fetched afterwards, at roughly a third of the dataset's size — which
  # auditing by hand never made a problem and a nightly audit does: two
  # gigabytes a night is about 700 MB a night, against a 20Gi volume.
  # Discarding one takes nothing out of the audit trail; the run, its report,
  # its findings and its trace are small and stay, and the most recent run of
  # each dataset keeps its data whatever this says. 0 keeps everything.
  #
  # Hours, because a Go duration has no day unit and "14d" is a startup error.
  retain_databases: 336h # 14 days
  max_upload_bytes: 2147483648

  # AGPL section 13: whoever modified Veritix and serves it to other people
  # owes those people that source. This is the offer the interface makes in its
  # footer on every screen. Point it at your fork; empty removes the link, for
  # a build shipped under commercial terms.
  source_url: https://github.com/russellw/veritix

engine:
  # Keep this comfortably below the container's memory limit. DuckDB spills to
  # disk when it reaches its own limit, and is OOMKilled when it reaches the
  # cgroup's — the first is slow and the second loses the run, so the number
  # that matters is this one being the smaller of the two.
  #
  # It bounds the working set, not the dataset: a run started over HTTP keeps
  # its tables in a DuckDB file on the volume, so 2GB here does not mean two
  # gigabytes of CSV is the ceiling. See docs/scale.md.
  memory_limit: 2GB
  threads: 2
  # One measurement over one column of the largest table, not one request.
  # Measured: a column of twenty million values takes about three minutes on
  # four cores, and a limit below what the column costs does not fail the
  # audit — it drops the column and reports the rest, which is why
  # column.not_profiled exists. Raise it rather than lower it.
  query_timeout: 30m
  # A statement the model wrote, which is the SQL here nobody reviewed. This
  # is where "one runaway query must not exhaust the host" belongs.
  agent_query_timeout: 2m
  # A read-only root filesystem means the spill directory has to be a volume,
  # and this is the emptyDir the Deployment mounts.
  temp_dir: /tmp

# A default install talks to nobody. Turning the agent on is a deliberate act,
# and over HTTP it is per-run rather than server-wide: the checkbox on the run
# screen, or "agent": true on POST /runs. Set the provider here and the option
# is offered; leave it and Veritix is the deterministic auditor, which is a
# complete product on its own.
llm:
  provider: none
  # provider: anthropic          # api_key from VERITIX_LLM_API_KEY, in a Secret
  # provider: openai-compatible  # base_url: http://llama.llm.svc.cluster.local:8080/v1
  max_steps: 40
  request_timeout: 10m

# The clock that starts the audits nobody pressed. A dataset is audited on one
# only if somebody asked for it — that is a row in the run store, set from the
# dataset screen — so what this turns off is the clock itself, which is what a
# second process sharing this volume would need. At most one audit starts per
# tick, which is what staggers a restart with several datasets due at once.
#
# It agrees with replicas: 1 for the same reason everything else here does: two
# replicas would fire every window twice.
schedule:
  enabled: true
  tick: 30s

# OpenTelemetry is off by default, for the same reason the model provider is:
# an OTLP endpoint is a network egress, and this process holds data the
# customer will not send to a vendor. Spans carry counts, stage names and
# durations — never a table name, a column name or a cell value. See
# docs/deployment.md.
otel:
  enabled: false
  # endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318
  service_name: veritix
