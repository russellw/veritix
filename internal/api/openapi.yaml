openapi: 3.1.0

info:
  title: Veritix
  version: "1"
  summary: Audit datasets for integrity problems.
  description: |
    Veritix runs entirely on your own machine or your own cloud. Dataset
    contents never leave the process except where this API says they do, and
    the one place that serves raw customer data — a finding's offending rows —
    has to be asked for by name, one finding at a time.

    Bind address defaults to loopback. Exposing an instance to a network
    requires an auth token; the server refuses to start otherwise.
  license:
    # Dual licensed: the AGPL to everyone, or commercial terms for anyone who
    # needs terms it cannot give. See LICENSING.md in the repository.
    name: AGPL-3.0-or-later, or a commercial license
    identifier: AGPL-3.0-or-later OR LicenseRef-Veritix-Commercial

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: datasets
    description: The folders and workbooks Veritix has been pointed at.
  - name: runs
    description: Audits, their progress, and their reports.

paths:
  /health:
    get:
      tags: [runs]
      summary: Liveness check.
      description: The only unauthenticated endpoint, so that a load balancer or
        a container probe does not need a credential. It also carries the
        source-code offer the web interface shows in its footer, which has to
        be readable before a token has been accepted.
      security: []
      operationId: getHealth
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, version, source_url]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, examples: ["v0.2.0"] }
                  source_url:
                    type: string
                    description: Where this build's source can be obtained.
                      Defaults to the upstream repository; an operator serving a
                      modified Veritix sets server.source_url to their own, which
                      is what AGPL section 13 asks of them.
                    examples: ["https://github.com/russellw/veritix"]

  /openapi.yaml:
    get:
      summary: This document.
      security: []
      operationId: getOpenAPI
      responses:
        "200":
          description: The API contract.
          content:
            application/yaml:
              schema: { type: string }

  /capabilities:
    get:
      tags: [system]
      summary: What this server can do.
      description: Authenticated, unlike health — whether a machine has a model
        configured, and which one, is the operator's business rather than
        something to publish to anybody who can reach the port. The interface
        uses it to offer the agentic audit only where one will actually work.
      operationId: getCapabilities
      responses:
        "200":
          description: The server's capabilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: object
                    required: [available]
                    properties:
                      available:
                        type: boolean
                        description: Whether a model provider is configured.
                      provider: { type: string }
                      model: { type: string }
                      values_allowed_by_default:
                        type: boolean
                        description: Whether the operator has already permitted
                          cell values to reach the model in this server's own
                          configuration.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /datasets:
    get:
      tags: [datasets]
      summary: List registered datasets.
      operationId: listDatasets
      responses:
        "200":
          description: Datasets, most recently registered first.
          content:
            application/json:
              schema:
                type: object
                required: [datasets]
                properties:
                  datasets:
                    type: array
                    items: { $ref: "#/components/schemas/Dataset" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [datasets]
      summary: Register a dataset, by server path or by upload.
      description: |
        A directory is one dataset, not one dataset per file: cross-file keys
        and joins are checked, so the folder is the unit.

        Registering a path is for an operator who already has the data on the
        server. Uploading is how a business user supplies it from a Windows
        desktop; uploaded files are written under the server's data directory
        and never to a path the request controls.
      operationId: createDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: A file or directory on the server's filesystem.
                  examples: ["/srv/exports/retail-2026-08"]
                name:
                  type: string
                  description: Defaults to the base name of the path.
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                name: { type: string }
                files:
                  type: array
                  description: The files making up one dataset. Names are taken
                    as base names; directory components are rejected.
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Registered. Registering a path that is already known
            returns the dataset that already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: The upload exceeded the configured size limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /datasets/{datasetId}:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
    get:
      tags: [datasets]
      summary: Fetch one dataset.
      operationId: getDataset
      responses:
        "200":
          description: The dataset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [datasets]
      summary: Forget a dataset and its run history.
      description: Files the server uploaded are deleted with it. A path an
        operator registered in place is left alone — those bytes are theirs.
      operationId: deleteDataset
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /datasets/{datasetId}/rules:
    parameters:
      - $ref: "#/components/parameters/DatasetID"
    get:
      tags: [datasets]
      summary: The rules in force for this dataset.
      description: |
        Rules accepted from the agent's proposals. Every audit of this dataset
        applies them, in addition to any rules file the caller names.

        Described, not reproduced: a `one_of` rule's permitted set is
        materialized from the customer's own column, so this lists how many
        values a rule permits and not what they are.
      operationId: getDatasetRules
      responses:
        "200":
          description: The rules in force.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/Proposal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [datasets]
      summary: Accept a proposed rule into this dataset's rules.
      description: |
        This is where a proposal stops being a suggestion. From here on the
        deterministic pass enforces the rule on every audit of this dataset,
        with no model involved and nothing further to pay — which is the whole
        point of proposing rules at all.

        Nothing is accepted automatically. An accepted rule raises errors on
        future data and can fail a build, so it takes a person.

        The edits in this request are the review. A `one_of` rule permits
        whatever the column happened to hold when the audit ran, mistakes
        included, so `values` is how the reviewer strikes out a misspelling
        before blessing it forever.
      operationId: acceptProposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, proposal_id]
              properties:
                run_id:
                  type: string
                  description: The run that proposed it. It must have audited this dataset.
                proposal_id: { type: string }
                id:
                  type: string
                  description: Rename the rule. It must be unique among the rules in force.
                description: { type: string }
                severity:
                  type: string
                  enum: [info, warning, error]
                  description: How a future violation is reported. A rule defaults to error.
                values:
                  type: array
                  items: { type: string }
                  description: Replace what a one_of rule permits.
      responses:
        "201":
          description: Accepted, and in force from the next audit.
          content:
            application/json:
              schema:
                type: object
                required: [rule, rules_in_force]
                properties:
                  rule: { $ref: "#/components/schemas/Proposal" }
                  rules_in_force: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A rule of that name is already in force for this dataset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /runs:
    get:
      tags: [runs]
      summary: List run history, most recent first.
      operationId: listRuns
      parameters:
        - name: dataset_id
          in: query
          schema: { type: string }
          description: Restrict to one dataset.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [runs]
      summary: Start an audit.
      description: Returns as soon as the run is accepted. An audit takes
        seconds to minutes, so progress arrives over the events stream rather
        than by holding the request open.
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id]
              properties:
                dataset_id: { type: string }
                include_values:
                  type: boolean
                  default: false
                  description: Permit verbatim cell values in this run's report.
                    Off by default; a report is a file that gets emailed.
                top_values:
                  type: integer
                  default: 10
                  minimum: 0
                  maximum: 100
                  description: How many frequent values to record per column.
                rules:
                  type: string
                  description: Path on the server to a YAML file of your own
                    expectations, applied after the built-in checks.
                agent:
                  type: boolean
                  default: false
                  description: Run the model-driven investigation after the
                    deterministic pass. Off by default even where a provider is
                    configured, because sending a dataset's metadata to a model
                    is a decision to take per run rather than inherit from a
                    config file. Requires llm.provider to be set; a request
                    asking for it on a server with no model is refused.
                allow_sample_values:
                  type: boolean
                  default: false
                  description: Permit the model to see cell values, masked, for
                    this run alone. Off by default; the report and the trace
                    both record which policy was in force.
      responses:
        "202":
          description: Accepted, and queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: Fetch a run's status and finding counts.
      operationId: getRun
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [runs]
      summary: Stop a run in progress.
      operationId: cancelRun
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The run has already finished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /runs/{runId}/report:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: The full audit report.
      description: The same document the `veritix audit --format json` report
        renders, so the web interface and the JSON report cannot disagree.
        Available once the run has succeeded.
      operationId: getRunReport
      responses:
        "200":
          description: The report document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such run, or the run has not produced a report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /runs/{runId}/report.html:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: The report as a self-contained HTML page, for download.
      operationId: getRunReportHTML
      responses:
        "200":
          description: One HTML file with no external references.
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}/trace:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: Fetch the record of what the model was sent and what it answered.
      description: |
        Every step of the agentic investigation: the model's own words, each
        tool call's arguments, and each result exactly as the egress guard
        released it. Nothing is summarized — a summary of what left the process
        is not evidence about what left the process — so this is how a customer
        checks the egress promise rather than taking it on trust.

        404 for a run that was audited without a model, with a message saying so.
      operationId: getRunTrace
      responses:
        "200":
          description: The trace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTrace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: Server-sent events for a run's progress.
      description: |
        Emits a `progress` event for each stage the pipeline reaches, then one
        terminal `done` event carrying the finished run, and closes. A client
        that connects after the run has finished receives the `done` event
        immediately, so there is no race between starting a run and subscribing
        to it.

        M4's model traces will stream over this same channel.
      operationId: getRunEvents
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}/proposals:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [runs]
      summary: The rules the agent proposed during this run.
      description: |
        A proposal is not a finding. A finding says the data is wrong now; a
        proposal says an expectation should hold on every future audit, and one
        with no violations today is the best kind rather than a claim that
        failed to reproduce.

        This lists them described rather than reproduced, exactly as the report
        carries them. Fetch one proposal to see the values it would permit.
      operationId: listRunProposals
      responses:
        "200":
          description: What was proposed.
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items: { $ref: "#/components/schemas/Proposal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}/proposals/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - name: proposalId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [runs]
      summary: One proposed rule, including the values it would permit.
      description: |
        **This endpoint can serve raw customer data**, and is the only one
        besides the per-finding rows endpoint that does. A proposed `one_of`
        rule permits a list materialized from the customer's own column, so
        reviewing one means reading cell values — an accept screen that cannot
        show what it is about to bless is not a review.

        It is bounded the same way: one named proposal at a time, never inside
        a list response, and never logged.

        A proposal id identifies what the rule asserts rather than the words
        around it, so the same expectation proposed on three runs has one id.
      operationId: getRunProposal
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                type: object
                required: [proposal]
                properties:
                  proposal: { $ref: "#/components/schemas/Proposal" }
                  yaml:
                    type: string
                    description: The rule as it would appear in a rules file.
                  values_note:
                    type: string
                    description: Present when the rule permits a materialized set,
                      saying what those values are and are not.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /runs/{runId}/findings/{findingId}/rows:
    parameters:
      - $ref: "#/components/parameters/RunID"
      - name: findingId
        in: path
        required: true
        schema: { type: string }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    get:
      tags: [runs]
      summary: The rows a finding is about.
      description: |
        **This endpoint serves raw customer data.** It exists because showing
        somebody the three bad rows is the most useful thing an auditing tool
        can do, and it is the only endpoint that does. It must be requested per
        finding, it never appears inside a list response, and the rows are not
        logged. This is the same boundary the report's `--include-values`
        guards.

        A finding id is stable across runs of the same dataset, so it is scoped
        by run rather than global: the same problem found twice is the same id
        in two runs.
      operationId: getFindingRows
      responses:
        "200":
          description: The offending rows.
          content:
            application/json:
              schema:
                type: object
                required: [finding_id, columns, rows, truncated]
                properties:
                  finding_id: { type: string }
                  title: { type: string }
                  columns:
                    type: array
                    items: { type: string }
                  rows:
                    type: array
                    description: One array of cell values per row, in column order.
                    items:
                      type: array
                      items: { type: [string, "null"] }
                  truncated:
                    type: boolean
                    description: True when more rows matched than the limit returned.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This finding has no row query. Structural observations
            made while reading a file have no SQL behind them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required only when the server was started with an auth
        token. A token is mandatory for any non-loopback bind.

  parameters:
    DatasetID:
      name: datasetId
      in: path
      required: true
      schema: { type: string }
    RunID:
      name: runId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, in words meant for a person.

    Dataset:
      type: object
      required: [id, name, path, uploaded, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        path:
          type: string
          description: Where the data sits on the server.
        uploaded:
          type: boolean
          description: True when the server holds the bytes itself.
        created_at: { type: string, format: date-time }

    Run:
      type: object
      required: [id, dataset_id, status, created_at, findings]
      properties:
        id: { type: string }
        dataset_id: { type: string }
        status:
          type: string
          enum: [pending, running, succeeded, failed, canceled]
          description: succeeded means the audit completed. It says nothing
            about whether the data was clean.
        message:
          type: string
          description: Why the run stopped, when it failed.
        version: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        findings:
          type: object
          required: [total, errors, warnings, info]
          properties:
            total: { type: integer }
            errors: { type: integer }
            warnings: { type: integer }
            info: { type: integer }

    Proposal:
      type: object
      description: |
        A rule proposed for future audits, or one already accepted. It carries
        the shape of the expectation and a count of what it permits, never the
        values themselves — those come from one proposal at a time.
      required: [id, rule, target, expect, severity, violations_now]
      properties:
        id:
          type: string
          description: Identifies what the rule asserts, so the same expectation
            proposed on several runs is one thing to decide about.
        rule: { type: string, description: The rule's slug, as it appears in findings. }
        description: { type: string }
        rationale:
          type: string
          description: Why it was proposed, in the model's words. It carries no
            authority of its own.
        target: { type: string, description: The source name a person recognizes. }
        table: { type: string, description: The SQL name the rule is written against. }
        column: { type: string }
        expect:
          type: string
          enum: [not_null, unique, positive, non_negative, one_of, matches, range,
                 not_future, references, sql]
        severity:
          type: string
          enum: [info, warning, error]
        violations_now:
          type: integer
          description: What the rule measured when it was proposed. Zero is the
            good case — an expectation that already holds.
        permitted_value_count:
          type: integer
          description: How many values a one_of rule permits.
        permitted_values:
          type: array
          items: { type: string }
          description: The values themselves. Present only when one proposal was
            fetched by id, or when a report was asked to include values.

    AgentTrace:
      type: object
      description: |
        Every step of an agentic run, verbatim on both sides. This is the
        artifact that makes "your data does not leave the machine" checkable:
        each call's arguments are the model's own words, and each result is the
        exact payload the egress guard released.
      required: [provider, model, steps, usage, redaction, stopped]
      properties:
        provider: { type: string }
        model: { type: string }
        values_allowed:
          type: boolean
          description: Whether cell values were permitted for this run.
        findings: { type: integer }
        not_reproduced: { type: integer }
        max_steps: { type: integer }
        token_budget: { type: integer }
        stopped:
          type: string
          enum: [finished, step_budget, token_budget, provider_error, refused, canceled]
        error:
          type: string
          description: Set when the run ended because the provider failed.
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            cache_read_tokens: { type: integer }
            cache_write_tokens: { type: integer }
            reasoning_tokens: { type: integer }
        redaction:
          type: object
          description: What the guard did, so the withholding is counted rather
            than asserted.
          properties:
            shaped: { type: integer }
            masked: { type: integer }
            passed: { type: integer }
            truncated: { type: integer }
            sealed: { type: integer }
            bytes: { type: integer }
            context_documents:
              type: integer
              description: How many of the customer's own documents were
                admitted verbatim. They are the one thing the guard does not
                redact, because a data dictionary rendered as shapes explains
                nothing — see the context object below.
            context_bytes: { type: integer }
        context:
          type: object
          description: |
            The outbound half of the same record: what Veritix asked the
            customer's own MCP servers for, and what it got. Present only when
            a context server was configured, which is off by default.

            Every request is listed rather than counted, because the thing a
            reader is checking is that each one is a listing or a read of a URI
            that came out of a listing — never a string the model wrote. The
            documents themselves are in the steps, verbatim, like any other
            tool result.
          properties:
            servers:
              type: array
              description: What each configured server contributed, including
                the ones that contributed nothing and why.
              items:
                type: object
                properties:
                  name: { type: string }
                  documents: { type: integer }
                  omitted: { type: integer }
                  error: { type: string }
            documents:
              type: array
              description: The catalog the model was offered. It carries no
                URIs, for the same reason the model is not shown any.
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: What the model passes to read_context.
                  server: { type: string }
                  name: { type: string }
                  description: { type: string }
                  mime_type: { type: string }
                  size_bytes: { type: integer }
            requests:
              type: array
              description: Every call Veritix made, in order.
              items:
                type: object
                properties:
                  server: { type: string }
                  method:
                    type: string
                    examples: ["resources/list", "resources/read"]
                  uri:
                    type: string
                    description: For a read, always one the server itself
                      advertised.
                  bytes: { type: integer }
                  duration_ms: { type: integer }
                  error: { type: string }
            documents_read: { type: integer }
            bytes_admitted: { type: integer }
        steps:
          type: array
          items:
            type: object
            properties:
              step: { type: integer }
              thinking:
                type: string
                description: The model's reasoning, when the provider returns a
                  summary of it. Usually absent.
              text: { type: string }
              stop_reason: { type: string }
              duration_ms: { type: integer }
              usage: { type: object }
              calls:
                type: array
                items:
                  type: object
                  properties:
                    tool: { type: string }
                    arguments:
                      type: object
                      description: What the model asked for, as it wrote it.
                    result:
                      type: string
                      description: The exact bytes sent back to the model.
                    is_error: { type: boolean }
                    duration_ms: { type: integer }

    Comparison:
      type: object
      description: |
        What changed since the previous successful audit of the same dataset.

        Present on every run that has one to compare against, and absent from a
        dataset's first audit. Nothing has to ask for it: it is derived from
        report documents already stored, so unlike the agent there is no egress
        decision here for a caller to take.

        Findings are matched by their id, which names what a finding is about
        rather than where it landed in a list. That is also the limit — a
        column that leaves the export takes its findings with it and they are
        reported as resolved, which is what `notes` warns about.
      required: [baseline, summary]
      properties:
        baseline:
          type: object
          description: The run being compared against.
          properties:
            run_id: { type: string }
            source:
              type: string
              description: Where the baseline came from when it was a file
                rather than a stored run, which is how the CLI supplies one.
            started_at: { type: string, format: date-time }
            veritix_version: { type: string }
            root: { type: string }
        summary:
          type: object
          properties:
            new: { type: integer }
            worsened: { type: integer }
            resolved: { type: integer }
            improved: { type: integer }
            unchanged: { type: integer }
            new_errors: { type: integer }
            new_warnings: { type: integer }
        findings:
          type: array
          description: |
            What moved. A finding that is unchanged in both count and severity
            is counted in `summary.unchanged` and not repeated here: it is
            already in the report's own `findings`, and listing every one of
            them again would double the document to say nothing happened.
          items:
            type: object
            required: [id, rule, status]
            properties:
              id: { type: string }
              rule: { type: string }
              status:
                type: string
                enum: [new, worsened, resolved, improved, unchanged]
              severity: { type: string, enum: [info, warning, error] }
              severity_before:
                type: string
                description: Set only when the severity moved, which happens
                  when a rule's severity was edited between the two runs.
              title: { type: string }
              table: { type: string }
              source: { type: string }
              column: { type: string }
              affected_count_before: { type: integer }
              affected_count_after: { type: integer }
        tables:
          type: array
          description: |
            Volume and schema drift: a table that appeared or vanished, a row
            count that moved, a column that is no longer in the export. No
            check that looks at one run can see any of it, and an export that
            quietly lost a third of its rows is a worse problem than anything
            in the findings.
          items:
            type: object
            required: [name, change]
            properties:
              name: { type: string }
              source: { type: string }
              change: { type: string, enum: [added, removed, changed] }
              row_count_before: { type: integer }
              row_count_after: { type: integer }
              columns_added: { type: array, items: { type: string } }
              columns_removed: { type: array, items: { type: string } }
        notes:
          type: array
          description: Caveats about the comparison itself, for a reader
            deciding how much to trust it.
          items: { type: string }

    Report:
      type: object
      description: |
        The audit report. Its shape is versioned by its own `schema` field
        rather than by this document, because the same structure is what
        `veritix audit --format json` writes to a file. Findings lead it: they
        are the reason to read it.
      required: [schema, run, dataset, finding_summary, redaction]
      properties:
        schema: { type: string, examples: ["veritix.audit/v1"] }
        veritix_version: { type: string }
        run: { type: object }
        dataset: { type: object }
        finding_summary: { type: object }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        comparison:
          $ref: "#/components/schemas/Comparison"
        tables: { type: array, items: { type: object } }
        skipped_files: { type: array, items: { type: object } }
        redaction:
          type: object
          description: What was withheld, so a reader can tell "nothing notable
            here" apart from "values were not included".
          properties:
            values_included: { type: boolean }
            note: { type: string }
        agent:
          type: object
          description: |
            What the model-driven investigation did, when one ran. Absent
            entirely from a deterministic-only audit, so that a reader can tell
            at a glance whether a model was involved. The full trace is a
            separate document at /runs/{runId}/trace.
          properties:
            provider: { type: string }
            model: { type: string }
            steps: { type: integer }
            tool_calls: { type: integer }
            findings:
              type: integer
              description: How many findings the agent contributed.
            not_reproduced:
              type: integer
              description: How many it proposed that the engine measured at
                zero and refused to record.
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            values_sent_to_model:
              type: boolean
              description: Whether this run was permitted to send cell values.
            values_withheld:
              type: integer
              description: How many values were replaced by their shape.
            context_documents:
              type: integer
              description: How many of the customer's own documents the model
                read. A count and not their contents — a report is a file that
                gets emailed, and the contents are in the trace.
            context_servers:
              type: array
              items: { type: string }
              description: The servers that answered, so a reader knows a
                document was consulted.
            stopped:
              type: string
              enum: [finished, step_budget, token_budget, provider_error, refused, canceled]
            complete:
              type: boolean
              description: False when the investigation was cut short, so a
                report does not imply thoroughness it did not have.
            duration_ms: { type: integer }

    Finding:
      type: object
      required: [id, rule, severity, origin, title, verified]
      properties:
        id:
          type: string
          description: Stable across runs. Use it to request the finding's rows.
        rule: { type: string, examples: ["column.mixed_date_formats"] }
        severity: { type: string, enum: [info, warning, error] }
        origin:
          type: string
          enum: [check, rule, agent]
          description: What produced it, so a reader can weigh it.
        title: { type: string }
        detail:
          type: string
          description: Why it matters downstream, not what the check looked at.
        remedy: { type: string }
        table: { type: string }
        source: { type: string }
        column: { type: string }
        file: { type: string }
        line: { type: integer }
        affected_count: { type: integer }
        total: { type: integer }
        affected_share: { type: number }
        expected: { type: string }
        observed: { type: string }
        evidence_query:
          type: string
          description: The statement that reproduces the finding, included so a
            reader can check the claim rather than take it on trust.
        verified:
          type: boolean
          description: The evidence was re-run and the number reproduced. A
            finding that does not reproduce is dropped rather than reported.
